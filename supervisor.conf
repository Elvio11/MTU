; Supervisor config for Python agents (Section 8.3)
; Start Supervisor: supervisord -c supervisor.conf
; Control: supervisorctl -c supervisor.conf status/start/stop/restart

[unix_http_server]
file=/tmp/supervisor.sock   ; path to your socket file

[supervisord]
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
nodaemon=false
minfds=1024
minprocs=200

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; AGT-01: NOFX (Radar) - Must start after Guardian
[program:agt-01-nofx]
command=python -m src.python.agents.nofx
directory=D:/Trader
autostart=true
autorestart=true
startretries=999
redirect_stderr=true
stdout_logfile=logs/agt-01-nofx.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
priority=20

