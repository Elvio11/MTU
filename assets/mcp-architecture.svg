<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mcp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="900" height="500" rx="16" fill="url(#bg)"/>
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">MTUS-MCP Server Architecture</text>
  <text x="450" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Model Context Protocol — AI Agent Integration Layer (13 Tools)</text>

  <!-- AI Agent -->
  <rect x="330" y="80" width="240" height="60" rx="12" fill="url(#ai)" filter="url(#shadow)"/>
  <text x="450" y="105" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">AI Agent</text>
  <text x="450" y="125" text-anchor="middle" fill="#fef3c7" font-size="11">Claude, GPT, etc.</text>

  <!-- Arrow down -->
  <line x1="450" y1="140" x2="450" y2="170" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="445,165 450,175 455,165" fill="#f59e0b"/>
  <text x="470" y="160" fill="#f59e0b" font-size="10">Tool calls</text>

  <!-- MCP Server -->
  <rect x="300" y="175" width="300" height="70" rx="12" fill="url(#mcp)" filter="url(#shadow)"/>
  <text x="450" y="203" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">MTUS-MCP Server</text>
  <text x="450" y="222" text-anchor="middle" fill="#ede9fe" font-size="11">@modelcontextprotocol/sdk + stdio transport</text>
  <text x="450" y="237" text-anchor="middle" fill="#c4b5fd" font-size="10">TypeScript | 13 registered tools</text>

  <!-- Tools grid -->
  <!-- Row 1 -->
  <rect x="30" y="270" width="160" height="40" rx="8" fill="url(#tool)" filter="url(#shadow)"/>
  <text x="110" y="294" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">get_config</text>

  <rect x="210" y="270" width="160" height="40" rx="8" fill="url(#tool)" filter="url(#shadow)"/>
  <text x="290" y="294" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">update_config</text>

  <rect x="390" y="270" width="160" height="40" rx="8" fill="url(#tool)" filter="url(#shadow)"/>
  <text x="470" y="294" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">get_positions</text>

  <rect x="570" y="270" width="160" height="40" rx="8" fill="url(#tool)" filter="url(#shadow)"/>
  <text x="650" y="294" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">get_balance</text>

  <rect x="750" y="270" width="120" height="40" rx="8" fill="url(#tool)" filter="url(#shadow)"/>
  <text x="810" y="294" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">get_pnl</text>

  <!-- Row 2 -->
  <rect x="30" y="320" width="160" height="40" rx="8" fill="url(#tool)" filter="url(#shadow)"/>
  <text x="110" y="344" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">get_agents</text>

  <rect x="210" y="320" width="160" height="40" rx="8" fill="url(#tool)" filter="url(#shadow)"/>
  <text x="290" y="344" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">pause_trading</text>

  <rect x="390" y="320" width="160" height="40" rx="8" fill="url(#tool)" filter="url(#shadow)"/>
  <text x="470" y="344" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">resume_trading</text>

  <rect x="570" y="320" width="160" height="40" rx="8" fill="url(#tool)" filter="url(#shadow)"/>
  <text x="650" y="344" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">kill_switch</text>

  <rect x="750" y="320" width="120" height="40" rx="8" fill="url(#tool)" filter="url(#shadow)"/>
  <text x="810" y="344" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">get_alerts</text>

  <!-- Row 3 -->
  <rect x="30" y="370" width="160" height="40" rx="8" fill="url(#tool)" filter="url(#shadow)"/>
  <text x="110" y="394" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">get_sniper_address</text>

  <rect x="210" y="370" width="160" height="40" rx="8" fill="url(#tool)" filter="url(#shadow)"/>
  <text x="290" y="394" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">get_audit_log</text>

  <rect x="390" y="370" width="160" height="40" rx="8" fill="url(#tool)" filter="url(#shadow)"/>
  <text x="470" y="394" text-anchor="middle" fill="#fff" font-size="11" font-weight="600">decrypt_keystore</text>

  <!-- Arrows from MCP to tools -->
  <line x1="450" y1="245" x2="450" y2="270" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- MTUS system -->
  <rect x="250" y="430" width="400" height="55" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="455" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700">MTUS Trading System</text>
  <text x="450" y="473" text-anchor="middle" fill="#60a5fa" font-size="10">PostgreSQL + Redis + Keystores + Config</text>

  <!-- Arrow from tools to MTUS -->
  <line x1="450" y1="410" x2="450" y2="430" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Side note -->
  <rect x="30" y="430" width="200" height="55" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="130" y="452" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">Security</text>
  <text x="130" y="470" text-anchor="middle" fill="#94a3b8" font-size="10">Keystore decryption</text>
  <text x="130" y="483" text-anchor="middle" fill="#94a3b8" font-size="10">Argon2id + XSalsa20</text>

  <rect x="670" y="430" width="200" height="55" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="770" y="452" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600">Transport</text>
  <text x="770" y="470" text-anchor="middle" fill="#94a3b8" font-size="10">stdio (Claude Desktop)</text>
  <text x="770" y="483" text-anchor="middle" fill="#94a3b8" font-size="10">zod schema validation</text>
</svg>
