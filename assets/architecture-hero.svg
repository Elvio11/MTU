  <text x="750" y="124" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">RugCheck</text>
  <rect x="840" y="100" width="140" height="38" rx="8" fill="url(#ext)" filter="url(#shadow)"/>
  <text x="910" y="124" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Birdeye</text>
