  <text x="645" y="262" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">AGT-12 HydraAgent</text>
  <text x="645" y="275" text-anchor="middle" fill="#dbeafe" font-size="8">Trend &amp; Bonding Curve Monitor</text>

