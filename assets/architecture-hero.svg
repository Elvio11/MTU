  <line x1="270" y1="138" x2="645" y2="190" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  <!-- RPC -> Ares -->
  <line x1="590" y1="138" x2="160" y2="445" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.4"/>
  <!-- Pump.fun -> Hydra -->
  <line x1="1080" y1="138" x2="645" y2="245" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Internal flow arrows (simplified) -->
