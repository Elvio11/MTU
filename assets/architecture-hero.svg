  <text x="320" y="594" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">Tailwind CSS 4</text>
  <rect x="400" y="578" width="120" height="24" rx="6" fill="url(#dash)" filter="url(#shadow)"/>
  <text x="460" y="594" text-anchor="middle" fill="#fff" font-size="10" font-weight="600">Recharts</text>
  <rect x="540" y="578" width="120" height="24" rx="6" fill="url(#dash)" filter="url(#shadow)"/>
