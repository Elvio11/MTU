<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="py" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="ts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="dash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="infra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="900" height="520" rx="16" fill="url(#bg)"/>
  <text x="450" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">MTUS Technology Stack</text>
  <text x="450" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Full stack from blockchain to UI</text>

  <!-- Layer 1: Blockchain -->
  <rect x="30" y="80" width="840" height="70" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="30" y="75" fill="#f59e0b" font-size="11" font-weight="600" letter-spacing="1">BLOCKCHAIN LAYER</text>
  <rect x="50" y="95" width="160" height="40" rx="8" fill="#f59e0b" filter="url(#shadow)"/>
  <text x="130" y="113" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Solana</text>
  <text x="130" y="127" text-anchor="middle" fill="#fef3c7" font-size="9">Mainnet Beta</text>
  <rect x="230" y="95" width="160" height="40" rx="8" fill="#f59e0b" filter="url(#shadow)"/>
  <text x="310" y="113" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Jupiter Aggregator</text>
  <text x="310" y="127" text-anchor="middle" fill="#fef3c7" font-size="9">Swap V1/V2 + Price V3</text>
  <rect x="410" y="95" width="160" height="40" rx="8" fill="#f59e0b" filter="url(#shadow)"/>
  <text x="490" y="113" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Pump.fun</text>
  <text x="490" y="127" text-anchor="middle" fill="#fef3c7" font-size="9">Bonding Curve Platform</text>
  <rect x="590" y="95" width="160" height="40" rx="8" fill="#f59e0b" filter="url(#shadow)"/>
  <text x="670" y="113" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">@solana/web3.js</text>
  <text x="670" y="127" text-anchor="middle" fill="#fef3c7" font-size="9">v1.98.4</text>
  <rect x="770" y="95" width="80" height="40" rx="8" fill="#f59e0b" filter="url(#shadow)"/>
  <text x="810" y="120" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">RPCs</text>

  <!-- Layer 2: Python Agents -->
  <rect x="30" y="170" width="410" height="170" rx="10" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="30" y="165" fill="#3b82f6" font-size="11" font-weight="600" letter-spacing="1">PYTHON 3.11+ (7 Agents)</text>
  <text x="50" y="195" fill="#dbeafe" font-size="11">Runtime: Python 3.11+ (asyncio)</text>
  <text x="50" y="215" fill="#93c5fd" font-size="10">websockets, aioredis, redis, pydantic, requests</text>
  <text x="50" y="235" fill="#93c5fd" font-size="10">solana, solders, psycopg2-binary, pyyaml</text>
  <text x="50" y="255" fill="#93c5fd" font-size="10">argon2-cffi, pynacl, jsonschema, numpy</text>
  <text x="50" y="280" fill="#60a5fa" font-size="11" font-weight="600">Agents:</text>
  <text x="120" y="280" fill="#dbeafe" font-size="10">Nofx, Hermes, Anansi, Oracle, Cassandra, Ledger, Heracles, Hydra, PortfolioSizer, DashboardBridge, TelegramBot</text>
  <text x="50" y="305" fill="#60a5fa" font-size="11" font-weight="600">Shared (28 modules):</text>
  <text x="160" y="305" fill="#dbeafe" font-size="10">Envelope, Keystore, Circuit Breaker, Rate Limiter, Validators, Constants, Priority Queue, Paper Trading, Bonding Curve, Indicators, API Manager</text>

  <!-- Layer 3: TypeScript Agents -->
  <rect x="460" y="170" width="410" height="170" rx="10" fill="#164e63" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="460" y="165" fill="#06b6d4" font-size="11" font-weight="600" letter-spacing="1">TYPESCRIPT 5 (3 Agents + MCP)</text>
  <text x="480" y="195" fill="#ecfeff" font-size="11">Runtime: Node.js 20 LTS (TypeScript 5.2)</text>
  <text x="480" y="215" fill="#67e8f9" font-size="10">@solana/web3.js, @solana/spl-token, @jup-ag/api</text>
  <text x="480" y="235" fill="#67e8f9" font-size="10">ioredis, pg, better-sqlite3, axios, argon2</text>
  <text x="480" y="255" fill="#67e8f9" font-size="10">tweetnacl, uuid, luxon, js-yaml, ajv, dotenv</text>
  <text x="480" y="280" fill="#22d3ee" font-size="11" font-weight="600">Agents:</text>
  <text x="550" y="280" fill="#ecfeff" font-size="10">Ares (Trade Executor), Sentinel (TP/SL), Janus (Capital Sweep)</text>
  <text x="480" y="305" fill="#22d3ee" font-size="11" font-weight="600">MCP Server:</text>
  <text x="570" y="305" fill="#ecfeff" font-size="10">@modelcontextprotocol/sdk, zod (13 AI tools)</text>
  <text x="480" y="325" fill="#22d3ee" font-size="11" font-weight="600">Shared (27 modules):</text>
  <text x="570" y="325" fill="#ecfeff" font-size="10">Envelope, DB, Keystore, Redis, Circuit Breaker</text>

  <!-- Layer 4: Infrastructure -->
  <rect x="30" y="360" width="840" height="70" rx="10" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="30" y="355" fill="#8b5cf6" font-size="11" font-weight="600" letter-spacing="1">INFRASTRUCTURE</text>
  <rect x="50" y="375" width="140" height="40" rx="8" fill="url(#infra)" filter="url(#shadow)"/>
  <text x="120" y="393" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Redis 7.x</text>
  <text x="120" y="407" text-anchor="middle" fill="#ede9fe" font-size="9">Pub/Sub + Cache</text>
  <rect x="210" y="375" width="140" height="40" rx="8" fill="url(#infra)" filter="url(#shadow)"/>
  <text x="280" y="393" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">PostgreSQL</text>
  <text x="280" y="407" text-anchor="middle" fill="#ede9fe" font-size="9">Positions + Audit</text>
  <rect x="370" y="375" width="140" height="40" rx="8" fill="url(#infra)" filter="url(#shadow)"/>
  <text x="440" y="393" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">PM2</text>
  <text x="440" y="407" text-anchor="middle" fill="#ede9fe" font-size="9">Process Manager</text>
  <rect x="530" y="375" width="140" height="40" rx="8" fill="url(#infra)" filter="url(#shadow)"/>
  <text x="600" y="393" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Supervisor</text>
  <text x="600" y="407" text-anchor="middle" fill="#ede9fe" font-size="9">Python Processes</text>
  <rect x="690" y="375" width="160" height="40" rx="8" fill="url(#infra)" filter="url(#shadow)"/>
  <text x="770" y="393" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">Argon2id + XSalsa20</text>
  <text x="770" y="407" text-anchor="middle" fill="#ede9fe" font-size="9">Keystore Encryption</text>

  <!-- Layer 5: Dashboard -->
  <rect x="30" y="450" width="840" height="60" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="30" y="445" fill="#10b981" font-size="11" font-weight="600" letter-spacing="1">DASHBOARD UI</text>
  <rect x="50" y="465" width="140" height="32" rx="8" fill="url(#dash)" filter="url(#shadow)"/>
  <text x="120" y="485" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Next.js 16.2.4</text>
  <rect x="210" y="465" width="120" height="32" rx="8" fill="url(#dash)" filter="url(#shadow)"/>
  <text x="270" y="485" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">React 19.2.4</text>
  <rect x="350" y="465" width="120" height="32" rx="8" fill="url(#dash)" filter="url(#shadow)"/>
  <text x="410" y="485" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Tailwind CSS 4</text>
  <rect x="490" y="465" width="100" height="32" rx="8" fill="url(#dash)" filter="url(#shadow)"/>
  <text x="540" y="485" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Recharts</text>
  <rect x="610" y="465" width="100" height="32" rx="8" fill="url(#dash)" filter="url(#shadow)"/>
  <text x="660" y="485" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Lucide Icons</text>
  <rect x="730" y="465" width="120" height="32" rx="8" fill="url(#dash)" filter="url(#shadow)"/>
  <text x="790" y="485" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">Vitest + Playwright</text>

  <!-- Footer -->
  <text x="450" y="510" text-anchor="middle" fill="#64748b" font-size="10">55+ shared modules | 327 tests | Paper &amp; Production modes | Multi-language interop via Redis</text>
</svg>
