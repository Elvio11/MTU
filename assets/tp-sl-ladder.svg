<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="entry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="tp1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="tp2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="sl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="480" rx="16" fill="url(#bg)"/>
  <text x="400" y="38" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="700">TP/SL Price Ladder</text>
  <text x="400" y="58" text-anchor="middle" fill="#94a3b8" font-size="12">Position exit levels based on price movement from entry</text>

  <!-- Price axis -->
  <line x1="120" y1="90" x2="120" y2="420" stroke="#475569" stroke-width="2"/>
  <text x="120" y="80" text-anchor="middle" fill="#94a3b8" font-size="11">Price</text>

  <!-- TP2 line -->
  <line x1="140" y1="120" x2="760" y2="120" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="140" y="105" width="100" height="30" rx="6" fill="url(#tp2)" filter="url(#shadow)"/>
  <text x="190" y="125" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">TP2: 5x</text>
  <text x="400" y="115" text-anchor="middle" fill="#67e8f9" font-size="12">Sell remaining 50% — Full profit taken</text>

  <!-- TP1 line -->
  <line x1="140" y1="200" x2="760" y2="200" stroke="#10b981" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="140" y="185" width="100" height="30" rx="6" fill="url(#tp1)" filter="url(#shadow)"/>
  <text x="190" y="205" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">TP1: 2x</text>
  <text x="400" y="195" text-anchor="middle" fill="#34d399" font-size="12">Sell 50% — Set trailing stop at 85% of peak</text>

  <!-- Entry line -->
  <line x1="140" y1="280" x2="760" y2="280" stroke="#3b82f6" stroke-width="2"/>
  <rect x="140" y="265" width="100" height="30" rx="6" fill="url(#entry)" filter="url(#shadow)"/>
  <text x="190" y="285" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">ENTRY: 1x</text>
  <text x="400" y="275" text-anchor="middle" fill="#93c5fd" font-size="12">Position opened — monitoring begins</text>

  <!-- SL line -->
  <line x1="140" y1="360" x2="760" y2="360" stroke="#ef4444" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="140" y="345" width="100" height="30" rx="6" fill="url(#sl)" filter="url(#shadow)"/>
  <text x="190" y="365" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">SL: 0.7x</text>
  <text x="400" y="355" text-anchor="middle" fill="#f87171" font-size="12">Sell 100% — Stop loss triggered (-30%)</text>

  <!-- Trailing stop annotation -->
  <rect x="500" y="140" width="260" height="50" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="630" y="160" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="600">Trailing Stop: 85% of peak</text>
  <text x="630" y="178" text-anchor="middle" fill="#c4b5fd" font-size="10">After TP1, sell remaining if price drops 15%</text>

  <!-- Time SL annotation -->
  <rect x="500" y="310" width="260" height="50" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="630" y="330" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">Time Stop Loss: 4 hours</text>
  <text x="630" y="348" text-anchor="middle" fill="#fcd34d" font-size="10">Force sell if no TP1 within 4 hours</text>

  <!-- Profit zone -->
  <rect x="140" y="90" width="620" height="190" rx="0" fill="#10b981" fill-opacity="0.05"/>
  <text x="750" y="105" text-anchor="end" fill="#10b981" font-size="10" opacity="0.6">Profit Zone</text>

  <!-- Loss zone -->
  <rect x="140" y="280" width="620" height="130" rx="0" fill="#ef4444" fill-opacity="0.05"/>
  <text x="750" y="295" text-anchor="end" fill="#ef4444" font-size="10" opacity="0.6">Loss Zone</text>

  <!-- Example values -->
  <rect x="40" y="430" width="720" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="448" text-anchor="middle" fill="#94a3b8" font-size="11">Example: Entry = 0.0005 SOL → TP1 = 0.001 SOL → TP2 = 0.0025 SOL → SL = 0.00035 SOL</text>
  <text x="400" y="463" text-anchor="middle" fill="#64748b" font-size="10">Position size: 0.0005 SOL (default) | Max concurrent: 1 | Daily loss limit: 0.002 SOL</text>
</svg>
